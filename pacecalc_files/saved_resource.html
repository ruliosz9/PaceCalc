				<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<style>
					body {
						background-color: white; /* Ensure the iframe has a white background */
					}
				</style>
				<script>
					const CDN_WHITELIST = [
						'cdn.jsdelivr.net',
						'cdnjs.cloudflare.com',
						'cdn.tailwindcss.com',
						'unpkg.com',
						'fonts.googleapis.com',
						'd3js.org',
						'cdn.babylonjs.com',
						'html2canvas.hertzen.com',
						'code.jquery.com',
						'cdn.datatables.net',
						'kit.fontawesome.com',
						'code.createjs.com',
						'cdn.plot.ly',
						'fonts.gstatic.com',
						'www.rgraph.net',
						'api.mapbox.com',
						'polyfill.io',
						'cdn.quilljs.com',
						'picsum.photos',
						'esm.sh'
					];

					function isUrlInWhitelist(url) {
						if (!url || typeof url !== 'string') {
							return false;
						}
						try {
							const urlObj = new URL(url);
							const hostname = urlObj.hostname;
							return CDN_WHITELIST.some(domain => hostname === domain);
						} catch (e) {
							return false;
						}
					}

					function proxyCdnUrl(url) {
						if (!url || !url.startsWith('http')) {
							return url;
						}
						if (!isUrlInWhitelist(url)) {
							return url;
						}
						if (!url.startsWith('https://artifacts-cdn.chatglm.site/')) {
							return 'https://artifacts-cdn.chatglm.site/' + url;
						}
						return url;
					}
					
					// 增强版外部链接拦截 - 适合放在模板字符串中
					document.addEventListener('click', function (ev) {
						try {
							const anchor = ev.target?.closest?.('a[href]') || null;
							if (!anchor) return;

							let href = anchor.getAttribute('href')?.trim() || '';
							if (!href) return;

							if (href.startsWith('javascript:')) return;

							// 新需求：href="#" 的链接完全阻止跳转和任何行为
							if (href === '#') {
								ev.preventDefault();
								return;
							}

							// 处理其他内部锚点（如 #about、#contact 等）
							if (href.startsWith('#')) {
								const rawId = href.slice(1);
								if (!rawId) return;

								const id = decodeURIComponent(rawId);
								const target = 
									document.getElementById(id) ||
									document.querySelector('a[name="' + id.replace(/"/g, '\"') + '"]') ||
									document.querySelector('[name="' + id.replace(/"/g, '\"') + '"]');

								if (target && target.scrollIntoView) {
									ev.preventDefault();
									try {
										history.pushState(null, '', href);
									} catch (e) {}
									target.scrollIntoView({ behavior: 'smooth', block: 'start' });
								}
								return;
							}

							// 处理外部链接
							let url;
							try {
								url = new URL(href, window.location.href);
							} catch (e) {
								return;
							}

							if (url.protocol !== 'http:' && url.protocol !== 'https:') return;

							const isExternal = url.hostname !== window.location.hostname;

							if (isExternal || anchor.getAttribute('target') === '_blank') {
								ev.preventDefault();
								window.open(url.toString(), '_blank', 'noopener,noreferrer');
							}

						} catch (e) {
							// 出错时不阻止默认行为
						}
					}, true);

					// 1. 暴力清除函数：从 DOM 层面抹除 onclick 属性
					const removeInlineOnclick = function () {
						// 专门锁定 href="#" 且带有 onclick 的 a 标签
						const targetedLinks = document.querySelectorAll('a[href="#"][onclick]');
						for (let i = 0; i < targetedLinks.length; i++) {
							targetedLinks[i].removeAttribute('onclick');
							targetedLinks[i].onclick = null; // 确保 JS 层的赋值也被清理
						}
					};
					// 3. 动态监测：防止页面通过异步加载重新生成带 onclick 的元素
					const observer = new MutationObserver(function () {
						removeInlineOnclick();
					});

					observer.observe(document.documentElement, {
						childList: true,
						subtree: true,
						attributes: true,
						attributeFilter: ['onclick']
					});

					// 4. 初始化执行一次
					removeInlineOnclick();

					const rawCreateElement = document.createElement;

					document.createElement = function (tagName, ...args) {
						const el = rawCreateElement.call(this, tagName, ...args);

						if (tagName.toLowerCase() === 'script') {
							const rawSetAttribute = el.setAttribute;
							const rawGetAttribute = el.getAttribute;
							let srcValue = '';
							
							el.setAttribute = function (name, value) {
								if (name === 'src' && typeof value === 'string') {
									value = proxyCdnUrl(value);
									srcValue = value;
								}
								return rawSetAttribute.call(this, name, value);
							};

							Object.defineProperty(el, 'src', {
								get: function() {
									return srcValue || rawGetAttribute.call(this, 'src') || '';
								},
								set: function(value) {
									if (typeof value === 'string') {
										srcValue = proxyCdnUrl(value);
										rawSetAttribute.call(this, 'src', srcValue);
									} else {
										srcValue = value;
									}
								},
								configurable: true,
								enumerable: true
							});
						}

						if (tagName.toLowerCase() === 'link') {
							const rawSetAttribute = el.setAttribute;
							const rawGetAttribute = el.getAttribute;
							let hrefValue = '';
							
							el.setAttribute = function (name, value) {
								if (name === 'href' && typeof value === 'string') {
									value = proxyCdnUrl(value);
									hrefValue = value;
								}
								return rawSetAttribute.call(this, name, value);
							};

							Object.defineProperty(el, 'href', {
								get: function() {
									return hrefValue || rawGetAttribute.call(this, 'href') || '';
								},
								set: function(value) {
									if (typeof value === 'string') {
										hrefValue = proxyCdnUrl(value);
										rawSetAttribute.call(this, 'href', hrefValue);
									} else {
										hrefValue = value;
									}
								},
								configurable: true,
								enumerable: true
							});
						}

						return el;
					};

					const OriginalXMLHttpRequest = window.XMLHttpRequest;
					window.XMLHttpRequest = function (...args) {
						const xhr = new OriginalXMLHttpRequest(...args);
						const rawOpen = xhr.open;

						xhr.open = function (method, url, ...rest) {
							if (typeof url === 'string') {
								const methodUpper = (method || '').toUpperCase();
								if (methodUpper === 'GET' && isUrlInWhitelist(url)) {
									url = proxyCdnUrl(url);
								}
							}
							return rawOpen.call(this, method, url, ...rest);
						};

						return xhr;
					};

					window.XMLHttpRequest.prototype = OriginalXMLHttpRequest.prototype;
					Object.setPrototypeOf(window.XMLHttpRequest, OriginalXMLHttpRequest);

					const originalFetch = window.fetch;
					window.fetch = async function (...args) {
						if (args.length > 0) {
							let url = '';
							let method = 'GET';
							
							if (typeof args[0] === 'string') {
								url = args[0];
								if (args[1] && args[1].method) {
									method = args[1].method.toUpperCase();
								}
								if (method === 'GET' && isUrlInWhitelist(url)) {
									args[0] = proxyCdnUrl(url);
								}
							} else if (args[0] instanceof Request) {
								const originalUrl = args[0].url;
								method = (args[0].method || 'GET').toUpperCase();
								if (method === 'GET' && isUrlInWhitelist(originalUrl)) {
									const proxiedUrl = proxyCdnUrl(originalUrl);
									if (proxiedUrl !== originalUrl) {
										args[0] = new Request(proxiedUrl, args[0]);
									}
								}
							}
						}
						return originalFetch.apply(this, args);
					};
				</script>

    <style>
        :root{
            --bg:#050505;--surface:#111;--surface-in:#151515;--surface-out:#0A0A0A;
            --text:#F5F5F5;--text-sec:#A3A3A3;--text-muted:#525252;
            --border:#1C1C1C;--border-out:#282828;--track:#1A1A1A;
            --accent:#F97316;--accent-l:#FB923C;--accent-dim:rgba(249,115,22,.12);
        }
        body.light{
            --bg:#F3F2EF;--surface:#FFF;--surface-in:#EEEEE9;--surface-out:#F0EFEC;
            --text:#1A1A1A;--text-sec:#555;--text-muted:#999;
            --border:#DCDCD8;--border-out:#C8C8C4;--track:#D4D4D0;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);
            min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
            transition:background .35s,color .35s}
        #app{max-width:420px;margin:0 auto;padding:20px 20px 48px;min-height:100dvh}
        .js-hide{display:none!important}

        .mb{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);
            background:var(--surface);color:var(--text-muted);display:inline-flex;align-items:center;
            justify-content:center;cursor:pointer;transition:all .25s;font-size:13px}
        .mb:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}

        .cb{border-radius:18px;padding:20px;position:relative;overflow:hidden;transition:all .3s}
        .cb.in{background:var(--surface-in);border:2px solid var(--border)}
        .cb.in::after{content:'';position:absolute;left:0;top:12px;bottom:12px;width:4px;
            background:var(--accent);border-radius:0 4px 4px 0}
        .cb.out{background:var(--surface-out);border:2px dashed var(--border-out)}
        .cb.out::before{content:'\f023';font-family:'Font Awesome 6 Free';font-weight:900;
            position:absolute;right:18px;top:50%;transform:translateY(-50%);
            font-size:90px;color:var(--text-muted);opacity:.03;pointer-events:none}

        .bh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
        .lg{display:flex;align-items:center;gap:8px}
        .bi{color:var(--accent);font-size:12px;width:28px;height:28px;display:flex;
            align-items:center;justify-content:center;background:var(--accent-dim);border-radius:8px;
            transition:color .3s,background .3s}
        .cb.out .bi{background:rgba(120,120,120,.07);color:var(--text-muted)}
        .bl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-sec);transition:color .35s}
        .cb.out .bl{color:var(--text-muted)}

        .lb{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);
            background:var(--bg);color:var(--text-muted);display:flex;align-items:center;
            justify-content:center;cursor:pointer;transition:all .2s;font-size:11px}
        .lb:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}

        .vr{display:flex;align-items:baseline;gap:7px;min-height:50px;margin-bottom:6px;justify-content:center}
        .bv{font-family:'Space Grotesk',sans-serif;font-size:2.6rem;font-weight:600;
            letter-spacing:-.03em;line-height:1.1;cursor:pointer;transition:color .2s;user-select:none}
        .cb.in .bv:hover{color:var(--accent-l)}
        .cb.out .bv{color:var(--accent);cursor:default}
        .vu{font-size:.85rem;font-weight:500;color:var(--text-muted);flex-shrink:0;transition:color .35s}
        .ei{font-family:'Space Grotesk',sans-serif;font-size:2.6rem;font-weight:600;
            letter-spacing:-.03em;line-height:1.1;background:var(--accent-dim);
            border:1.5px solid var(--accent);border-radius:10px;color:var(--text);
            padding:4px 12px;width:100%;outline:none}
        .sl{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:14px}
        .si{color:var(--text-muted);font-size:9px;transition:color .35s}
        .st{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:400;color:var(--text-sec);transition:color .35s}

        input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:5px;
            border-radius:3px;outline:none;cursor:pointer;
            --fill:0%;background:linear-gradient(to right,var(--accent) 0%,var(--accent) var(--fill),var(--track) var(--fill),var(--track) 100%)}
        input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
            border-radius:50%;background:var(--accent);
            box-shadow:0 0 0 3.5px var(--accent-dim),0 2px 6px rgba(0,0,0,.3);cursor:grab;
            transition:box-shadow .15s,transform .15s}
        input[type="range"]::-webkit-slider-thumb:active{cursor:grabbing;
            box-shadow:0 0 0 6px var(--accent-dim),0 2px 10px rgba(0,0,0,.4);transform:scale(1.08)}
        input[type="range"]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;
            background:var(--accent);border:none;
            box-shadow:0 0 0 3.5px var(--accent-dim),0 2px 6px rgba(0,0,0,.3);cursor:grab}
        input[type="range"]::-moz-range-track{height:5px;border-radius:3px;background:var(--track);border:none}
        input[type="range"]::-moz-range-progress{height:5px;border-radius:3px;background:var(--accent)}
        .tk{display:flex;justify-content:space-between;padding:4px 1px 0;font-size:8.5px;color:var(--text-muted);font-family:'Space Grotesk',sans-serif;transition:color .35s}

        .ts{display:flex;align-items:center;justify-content:center;gap:5px}
        .tc{display:flex;flex-direction:column;align-items:center;gap:2px}
        .sb{width:50px;height:30px;display:flex;align-items:center;justify-content:center;
            background:var(--bg);border:1px solid var(--border);border-radius:7px;
            color:var(--text-muted);cursor:pointer;transition:all .12s;font-size:10px;
            touch-action:none;user-select:none;-webkit-user-select:none}
        .sb:active,.sb.p{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
        .sv{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:600;
            line-height:1;min-width:50px;text-align:center;color:var(--text);transition:color .35s}
        .su{font-size:8.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:500;margin-top:1px;transition:color .35s}
        .tp{font-family:'Space Grotesk',sans-serif;font-size:1.2rem;font-weight:300;color:var(--text-muted);padding-bottom:20px;transition:color .35s}

        .sr{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
        .sc{padding:6px 14px;border-radius:8px;font-size:11.5px;font-weight:500;
            font-family:'DM Sans',sans-serif;color:var(--text-sec);background:var(--bg);
            border:1px solid var(--border);cursor:pointer;transition:all .2s;white-space:nowrap}
        .sc:hover{border-color:#333;background:var(--surface)}.sc:active{transform:scale(.95)}
        .sc.a{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:600}

        .pr{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
        .pp{background:var(--bg);border:1px solid var(--border);border-radius:8px;
            padding:7px 8px;text-align:center;flex:1;min-width:62px;transition:all .35s}
        .pl{font-size:8.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;transition:color .35s}
        .pv{font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;
            color:var(--text-sec);margin-top:2px;letter-spacing:-.01em;transition:color .35s}

        .sg{margin-bottom:10px}.sg:last-child{margin-bottom:0}
        .sll{font-size:10px;color:var(--text-muted);font-family:'Space Grotesk',sans-serif;font-weight:500;width:20px;text-align:right;flex-shrink:0;transition:color .35s}

        .ht{background:none;border:none;cursor:pointer;padding:0;font:inherit;display:flex;align-items:center}
        .hcv{transition:transform .3s;font-size:9px;color:var(--text-muted);margin-left:3px}
        .hcv.co{transform:rotate(-90deg)}
        .hp{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);
            background:var(--bg);color:var(--text-muted);display:flex;align-items:center;
            justify-content:center;cursor:pointer;transition:all .2s;font-size:11px;flex-shrink:0}
        .hp:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
        .hp:active{transform:scale(.9)}
        .clb{font-size:10px;color:var(--text-muted);background:none;border:none;cursor:pointer;
            font-family:'DM Sans',sans-serif;font-weight:500;transition:color .2s}
        .clb:hover{color:#EF4444}
        .hc{overflow:hidden;transition:max-height .35s,opacity .25s;max-height:400px;opacity:1}
        .hc.co{max-height:0;opacity:0;pointer-events:none}
        .hi{display:flex;align-items:center;justify-content:space-between;
            background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;
            animation:si .3s ease-out both;cursor:pointer;transition:border-color .15s}
        .hi:hover{border-color:var(--accent)}
        @keyframes si{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
        .hv{display:flex;align-items:center;gap:5px;font-size:11.5px;flex-wrap:wrap}
        .hd{font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--text)}
        .hs{color:var(--text-muted);font-size:7px}
        .htm,.hpc{color:var(--text-sec);font-family:'Space Grotesk',sans-serif}
        .hdb{width:24px;height:24px;border-radius:5px;border:none;background:transparent;
            color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;
            transition:all .2s;flex-shrink:0;font-size:10px}
        .hdb:hover{background:rgba(239,68,68,.1);color:#EF4444}
        .stl{font-family:'Space Grotesk',sans-serif;font-size:10.5px;font-weight:600;
            text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted)}
        .stl i{color:var(--accent);font-size:11px;margin-right:6px}

        .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(70px);
            background:var(--surface-in);color:var(--text);padding:9px 20px;border-radius:9px;
            font-size:12.5px;font-weight:500;border:1px solid var(--border);opacity:0;
            transition:all .3s cubic-bezier(.4,0,.2,1);z-index:1000;pointer-events:none;
            box-shadow:0 6px 20px rgba(0,0,0,.4)}
        .toast.v{transform:translateX(-50%) translateY(0);opacity:1}
        .vp{animation:vpu .3s ease-out}
        @keyframes vpu{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
        button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    </style>


<div id="app">

        </div>

            <button class="sc" data-d="5" onclick="setD(5)">5 km</button>
            <button class="sc a" data-d="10" onclick="setD(10)">10 km</button>
            <button class="sc" data-d="21.1" onclick="setD(21.1)">Semi</button>
            <button class="sc" data-d="42.2" onclick="setD(42.2)">Marathon</button>
        </div>
    </div>

    <!-- TEMPS -->
    <div class="cb in" style="margin-bottom:14px" id="b-time">
        <div class="bh">
            <div class="lg">
                <div class="bi"><i class="fa-solid fa-stopwatch"></i></div>
                <span class="bl">Temps</span>
            </div>
            <button class="lb" onclick="tog(&#39;time&#39;)" aria-label="Verrouiller"><i class="fa-solid fa-lock-open" style="font-size:10px"></i></button>
        </div>
        <div class="vr">
            <span class="bv" id="d-time" onclick="edS(&#39;time&#39;)">50:00</span>
            <input type="text" inputmode="text" class="ei js-hide" id="i-time" onblur="edE(&#39;time&#39;)" onkeydown="edK(event,&#39;time&#39;)">
        </div>
        <div id="c-time">
            <div class="ts">
                <div class="tc">
                    <button class="sb" id="uh" aria-label="h+"><i class="fa-solid fa-chevron-up"></i></button>
                    <span class="sv" id="vh">0</span><span class="su">h</span>
                    <button class="sb" id="dh" aria-label="h-"><i class="fa-solid fa-chevron-down"></i></button>
                </div><span class="tp">:</span>
                <div class="tc">
                    <button class="sb" id="um" aria-label="m+"><i class="fa-solid fa-chevron-up"></i></button>
                    <span class="sv" id="vm">50</span><span class="su">min</span>
                    <button class="sb" id="dm" aria-label="m-"><i class="fa-solid fa-chevron-down"></i></button>
                </div><span class="tp">:</span>
                <div class="tc">
                    <button class="sb" id="us" aria-label="s+"><i class="fa-solid fa-chevron-up"></i></button>
                    <span class="sv" id="vs">00</span><span class="su">s</span>
                    <button class="sb" id="ds" aria-label="s-"><i class="fa-solid fa-chevron-down"></i></button>
                </div>
            </div>
        </div>
        <div class="pr" style="margin-top:10px" id="time-proj">
            <div class="pp"><div class="pl">5 km</div><div class="pv" id="p5">25:00</div></div>
            <div class="pp"><div class="pl">10 km</div><div class="pv" id="p10">50:00</div></div>
            <div class="pp"><div class="pl">Semi</div><div class="pv" id="ps">1:45:30</div></div>
            <div class="pp"><div class="pl">Marathon</div><div class="pv" id="pm">3:31:00</div></div>
        </div>
    </div>

    <!-- ALLURE -->
    <div class="cb out" style="margin-bottom:14px" id="b-pace">
        <div class="bh">
            <div class="lg">
                <div class="bi"><i class="fa-solid fa-gauge-high"></i></div>
                <span class="bl">Allure</span>
            </div>
            <button class="lb" onclick="tog(&#39;pace&#39;)" aria-label="Déverrouiller"><i class="fa-solid fa-lock" style="font-size:10px"></i></button>
        </div>
        <div class="vr">
            <span class="bv" id="d-pace" onclick="edS(&#39;pace&#39;)">5:00</span>
            <input type="text" inputmode="text" class="ei js-hide" id="i-pace" onblur="edE(&#39;pace&#39;)" onkeydown="edK(event,&#39;pace&#39;)">
            <span class="vu">min/km</span>
        </div>
        <div class="sl">
            <span class="si"><i class="fa-solid fa-right-left"></i></span>
            <span class="st" id="d-spd">12.0 km/h</span>
        </div>
        <div id="c-pace" class="js-hide">
            <div class="sg"><div class="flex items-center gap-3"><span class="sll">min</span><input type="range" id="s-pm" min="2" max="15" step="1" value="5" oninput="onPS()" style="--fill: 23.076923076923077%;"></div></div>
            <div class="sg"><div class="flex items-center gap-3"><span class="sll">sec</span><input type="range" id="s-ps" min="0" max="59" step="1" value="0" oninput="onPS()" style="--fill: 0%;"></div></div>
        </div>
        <div class="sr" id="pace-shortcuts" style="margin-top:10px">
            <button class="sc" data-p="270" onclick="setP(270)">4:30</button>
            <button class="sc" data-p="285" onclick="setP(285)">4:45</button>
            <button class="sc a" data-p="300" onclick="setP(300)">5:00</button>
            <button class="sc" data-p="315" onclick="setP(315)">5:15</button>
            <button class="sc" data-p="330" onclick="setP(330)">5:30</button>
            <button class="sc" data-p="345" onclick="setP(345)">5:45</button>
            <button class="sc" data-p="360" onclick="setP(360)">6:00</button>
            <button class="sc" data-p="375" onclick="setP(375)">6:15</button>
            <button class="sc" data-p="390" onclick="setP(390)">6:30</button>
            <button class="sc" data-p="405" onclick="setP(405)">6:45</button>
        </div>
    </div>

    <!-- HISTORIQUE -->
    <section style="margin-bottom:24px">
        <div style="display:flex;align-items:center;margin-bottom:10px">
            <button class="ht" onclick="togH()">
                <span class="stl"><i class="fa-solid fa-clock-rotate-left"></i>Historique<i class="fa-solid fa-chevron-down hcv" id="hchev"></i></span>
            </button>
            <div style="flex:1"></div>
            <button class="clb" onclick="clrH()" id="clh" style="display:none">Tout effacer</button>
            <button class="hp" onclick="saveH()" aria-label="Sauvegarder" title="Sauvegarder" style="margin-left:8px">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>
        <div class="hc" id="hcon">
            <div id="hlist" class="space-y-2"></div>
        </div>
    </section>
</div>
<div id="tst" class="toast"></div>

<script>
var S={dist:10,h:0,m:50,s:0,pm:5,ps:0,cf:'pace',hist:[],hV:true,mode:'dark'};
try{S.mode=localStorage.getItem('pc_m')||'dark';S.hist=JSON.parse(localStorage.getItem('pc_h')||'[]')}catch(e){S.hist=[]}
if(S.hist.length>5)S.hist=S.hist.slice(0,5);

function toggleMode(){
    S.mode=S.mode==='dark'?'light':'dark';
    try{localStorage.setItem('pc_m',S.mode)}catch(e){}
    document.body.classList.toggle('light',S.mode==='light');
    document.querySelector('#mode-btn i').className=S.mode==='dark'?'fa-solid fa-moon':'fa-solid fa-sun';
}
if(S.mode==='light'){document.body.classList.add('light');document.querySelector('#mode-btn i').className='fa-solid fa-sun'}

function tS(){return S.h*3600+S.m*60+S.s}
function pS(){return S.pm*60+S.ps}
function sTS(t){t=Math.max(0,Math.min(21600,Math.round(t)));S.h=Math.floor(t/3600);S.m=Math.floor((t%3600)/60);S.s=t%60}
function sPS(p){p=Math.max(0,p);var r=Math.round(p);S.pm=Math.floor(r/60);S.ps=r%60}
function p2(n){return String(n).padStart(2,'0')}
function fT(t){t=Math.max(0,Math.round(t));var h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;return h>0?h+':'+p2(m)+':'+p2(s):m+':'+p2(s)}
function fP(p){if(p<=0)return'--:--';return Math.floor(p/60)+':'+p2(Math.round(p%60))}
function fSp(p){if(p<=0)return'-- km/h';return(3600/p).toFixed(1)+' km/h'}
function fD(d){return d.toFixed(2)}

function calc(){
    var ts=tS(),ps=pS(),d=S.dist;
    if(S.cf==='pace'){if(d>0)sPS(ts/d)}
    else if(S.cf==='time'){if(ps>0)sTS(d*ps)}
    else{if(ps>0)S.dist=Math.round((ts/ps)*100)/100}
    uDist();uTime();uPace();uProj();uSC();uSPC();uBS();
}

function uDist(){
    document.getElementById('d-dist').textContent=fD(S.dist);
    var sl=document.getElementById('s-dist');sl.value=Math.min(42.2,Math.max(0,S.dist));fS(sl);
}
function uTime(){
    document.getElementById('d-time').textContent=fT(tS());
    document.getElementById('vh').textContent=S.h;
    document.getElementById('vm').textContent=p2(S.m);
    document.getElementById('vs').textContent=p2(S.s);
}
function uPace(){
    var ps=pS(),txt=fP(ps),el=document.getElementById('d-pace');
    if(el.textContent!==txt){el.textContent=txt;if(S.cf==='pace'){el.classList.remove('vp');void el.offsetWidth;el.classList.add('vp')}}
    document.getElementById('d-spd').textContent=fSp(ps);
    var ip=S.cf!=='pace',cp=document.getElementById('c-pace');
    if(ip){cp.classList.remove('js-hide');document.getElementById('s-pm').value=S.pm;document.getElementById('s-ps').value=S.ps;fS(document.getElementById('s-pm'));fS(document.getElementById('s-ps'))}
    else cp.classList.add('js-hide');
}
function uProj(){
    var ps=pS(),e5=document.getElementById('p5'),e1=document.getElementById('p10'),eS=document.getElementById('ps'),eM=document.getElementById('pm');
    if(ps<=0){e5.textContent=e1.textContent=eS.textContent=eM.textContent='--:--';return}
    e5.textContent=fT(ps*5);e1.textContent=fT(ps*10);eS.textContent=fT(ps*21.1);eM.textContent=fT(ps*42.2);
}
function uSC(){
    var bs=document.querySelectorAll('#dist-shortcuts .sc');
    for(var i=0;i<bs.length;i++){var bd=parseFloat(bs[i].getAttribute('data-d'));bs[i].classList.toggle('a',Math.abs(bd-S.dist)<0.06)}
}
function uSPC(){
    var bs=document.querySelectorAll('#pace-shortcuts .sc');
    for(var i=0;i<bs.length;i++){var bp=parseInt(bs[i].getAttribute('data-p'),10);bs[i].classList.toggle('a',bp===pS())}
}
function uBS(){
    var fs=['dist','time','pace'];
    for(var i=0;i<fs.length;i++){
        var f=fs[i],b=document.getElementById('b-'+f),c=document.getElementById('c-'+f),
            li=b.querySelector('.lb i'),ic=f===S.cf;
        b.classList.toggle('in',!ic);b.classList.toggle('out',ic);
        if(ic){c.classList.add('js-hide')}else{c.classList.remove('js-hide')}
        li.className=ic?'fa-solid fa-lock':'fa-solid fa-lock-open';li.style.fontSize='10px';
    }
}

function fS(el){var mn=parseFloat(el.min),mx=parseFloat(el.max),v=parseFloat(el.value);el.style.setProperty('--fill',(mx>mn?((v-mn)/(mx-mn))*100:0)+'%')}
function onDS(sl){S.dist=Math.round(parseFloat(sl.value)*20)/20;fS(sl);calc()}
function setD(d){if(S.cf==='dist')S.cf='pace';S.dist=d;calc()}
function setP(sec){if(S.cf==='pace')S.cf='dist';sPS(sec);calc()}

function adjT(u,d){if(S.cf==='time')return;
    if(u==='h')S.h=Math.max(0,Math.min(6,S.h+d));
    else if(u==='m'){S.m+=d;if(S.m>59){S.m=0;S.h=Math.min(6,S.h+1)}if(S.m<0){S.m=59;S.h=Math.max(0,S.h-1)}}
    else{S.s+=d;if(S.s>59){S.s=0;S.m=Math.min(59,S.m+1)}if(S.s<0){S.s=59;S.m=Math.max(0,S.m-1)}}
    if(tS()>21600)sTS(21600);calc()}

function lp(el,cb){var iv=null,to=null;
    function st(e){e.preventDefault();el.classList.add('p');cb();to=setTimeout(function(){iv=setInterval(cb,65)},380)}
    function sp(){el.classList.remove('p');clearTimeout(to);clearInterval(iv)}
    el.addEventListener('mousedown',st);el.addEventListener('mouseup',sp);el.addEventListener('mouseleave',sp);
    el.addEventListener('touchstart',st,{passive:false});el.addEventListener('touchend',sp);el.addEventListener('touchcancel',sp)}

function onPS(){S.pm=parseInt(document.getElementById('s-pm').value,10);S.ps=parseInt(document.getElementById('s-ps').value,10);fS(document.getElementById('s-pm'));fS(document.getElementById('s-ps'));calc()}
function tog(f){if(f===S.cf)return;S.cf=f;calc()}

function edS(f){if(f===S.cf)return;var d=document.getElementById('d-'+f),i=document.getElementById('i-'+f);d.classList.add('js-hide');i.classList.remove('js-hide');i.value=d.textContent;i.focus();i.select()}
function edE(f){var d=document.getElementById('d-'+f),i=document.getElementById('i-'+f),v=i.value.trim();
    if(f==='dist'){var n=parseFloat(v.replace(',','.'));if(!isNaN(n)&&n>0)S.dist=Math.round(n*100)/100}
    else if(f==='time'){var p=v.split(':').map(Number);if(p.length===3&&p.every(function(x){return!isNaN(x)}))sTS(p[0]*3600+p[1]*60+p[2]);else if(p.length===2&&p.every(function(x){return!isNaN(x)}))sTS(p[0]*60+p[1])}
    else if(f==='pace'){var pp=v.split(':').map(Number);if(pp.length===2&&pp.every(function(x){return!isNaN(x)})){S.pm=Math.max(0,Math.min(59,pp[0]));S.ps=Math.max(0,Math.min(59,pp[1]))}}
    d.classList.remove('js-hide');i.classList.add('js-hide');calc()}
function edK(e,f){if(e.key==='Enter')e.target.blur();else if(e.key==='Escape'){document.getElementById('d-'+f).classList.remove('js-hide');document.getElementById('i-'+f).classList.add('js-hide')}}

function saveH(){var ts=tS(),ps=pS();if(S.dist<=0||ts<=0||ps<=0){toast('Valeurs invalides');return}
    var e={d:S.dist,ts:ts,ps:ps,cf:S.cf,t:Date.now()};
    for(var i=0;i<S.hist.length;i++){var h=S.hist[i];if(h.d===e.d&&h.ts===e.ts&&Math.abs(h.t-e.t)<2000){toast('Déjà enregistré');return}}
    S.hist.unshift(e);if(S.hist.length>5)S.hist.pop();
    try{localStorage.setItem('pc_h',JSON.stringify(S.hist))}catch(x){}renH();toast('Sauvegardé')}
function loadH(i){var e=S.hist[i];S.dist=e.d;sTS(e.ts);sPS(e.ps);S.cf=e.cf||'pace';calc();toast('Calcul chargé')}
function delH(i){S.hist.splice(i,1);try{localStorage.setItem('pc_h',JSON.stringify(S.hist))}catch(x){}renH()}
function clrH(){S.hist=[];try{localStorage.removeItem('pc_h')}catch(x){}renH();toast('Historique effacé')}
function togH(){S.hV=!S.hV;document.getElementById('hcon').classList.toggle('co',!S.hV);document.getElementById('hchev').classList.toggle('co',!S.hV)}
function renH(){var l=document.getElementById('hlist'),cb=document.getElementById('clh');
    if(!S.hist.length){l.innerHTML='';cb.style.display='none';return}
    cb.style.display='block';var html='';
    for(var i=0;i<S.hist.length;i++){var h=S.hist[i];
        html+='<div class="hi" style="animation-delay:'+i*40+'ms" onclick="loadH('+i+')"><div class="hv"><span class="hd">'+fD(h.d)+' km</span><span class="hs">&middot;</span><span class="htm">'+fT(h.ts)+'</span><span class="hs">&middot;</span><span class="hpc">'+fP(h.ps)+' min/km</span></div><button class="hdb" onclick="event.stopPropagation();delH('+i+')" aria-label="Supprimer"><i class="fa-solid fa-xmark"></i></button></div>'}
    l.innerHTML=html}

var tt=null;function toast(m){var e=document.getElementById('tst');e.textContent=m;e.classList.add('v');clearTimeout(tt);tt=setTimeout(function(){e.classList.remove('v')},1800)}

lp(document.getElementById('uh'),function(){adjT('h',1)});lp(document.getElementById('dh'),function(){adjT('h',-1)});
lp(document.getElementById('um'),function(){adjT('m',1)});lp(document.getElementById('dm'),function(){adjT('m',-1)});
lp(document.getElementById('us'),function(){adjT('s',1)});lp(document.getElementById('ds'),function(){adjT('s',-1)});
calc();renH();
var allS=document.querySelectorAll('input[type="range"]');for(var i=0;i<allS.length;i++)fS(allS[i]);
</script>


			
		
</body></html>
